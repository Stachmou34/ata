---
deployment:
  tasks:
    # 1) Adapte UNE SEULE FOIS ce chemin vers ton dossier public (garde /public_html à la fin)
    - export DEPLOYPATH=/home/CPANEL_USER/public_html
    # 2) Création des sous-dossiers si besoin
    - /bin/mkdir -p "$DEPLOYPATH/ar/sete" "$DEPLOYPATH/sete" "$DEPLOYPATH/images"
    # 3) Copie des fichiers du site (pages, assets, config) — pas les docs internes
    - /bin/cp -f index.html mentions-legales.html erreur-404.html favicon.png robots.txt sitemap.xml .htaccess google5cf29f286db93f8c.html "$DEPLOYPATH/"
    - /bin/cp -Rf ar sete images "$DEPLOYPATH/"
