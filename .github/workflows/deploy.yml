name: Déploiement FTP

# Publie le site sur l'hébergement à chaque push sur main.
# Peut aussi être lancé à la main : onglet Actions → "Déploiement FTP" → "Run workflow".
#
# Les étapes de publication vivent dans publier.yml, partagées avec la mise à
# jour quotidienne des horaires.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publier:
    uses: ./.github/workflows/publier.yml
    secrets: inherit
