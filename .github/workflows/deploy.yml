name: Déploiement FTP

# Déploie automatiquement le site sur l'hébergement à chaque push sur main.
# Peut aussi être lancé à la main : onglet Actions → "Déploiement FTP" → "Run workflow".
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   FTP_SERVER    ex. 91.216.107.49
#   FTP_USERNAME  ex. aman-2838522
#   FTP_PASSWORD  le mot de passe FTP
#   FTP_DIR       (optionnel) dossier cible, ex. ./public_html/  — défaut : ./

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # L'hebergeur ne compresse a la volee que le text/html. On depose donc une
      # version .gz a cote de chaque CSS/JS ; le .htaccess la sert quand le
      # navigateur accepte gzip, et retombe sur le fichier normal sinon.
      - name: Pre-compresser les CSS et JS
        run: |
          find . -path ./.git -prune -o \( -name '*.css' -o -name '*.js' \) -print \
            | grep -v '^./.github/' \
            | while read -r f; do
                gzip -9 -k -f "$f"
                printf '%s : %s -> %s octets\n' "$f" "$(stat -c%s "$f")" "$(stat -c%s "$f.gz")"
              done

      - name: Envoyer les fichiers en FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || './' }}
          protocol: ftp
          # Ne pas envoyer les fichiers de travail / documentation interne
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .cpanel.yml
            *.md
            **/node_modules/**
