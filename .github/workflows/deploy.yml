name: Déploiement FTP

# Déploie automatiquement le site sur l'hébergement à chaque push sur main.
# Peut aussi être lancé à la main : onglet Actions → "Déploiement FTP" → "Run workflow".
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   FTP_SERVER    ex. 91.216.107.49
#   FTP_USERNAME  ex. aman-2838522
#   FTP_PASSWORD  le mot de passe FTP
#   FTP_DIR       (optionnel) dossier cible, ex. ./public_html/  — défaut : ./

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Le tableau des traversees, l'annuaire des lignes et la flotte sont
      # construits en JavaScript : un moteur de recherche qui n'execute pas le JS
      # ne verrait qu'une page vide. On ecrit ce contenu dans le HTML au
      # deploiement ; le JS reprend la main pour le filtrage.
      - name: Pre-rendre la page Traversees
        run: python3 .github/scripts/prerender-traversees.py

      # L'hebergeur ne compresse a la volee que le text/html : un CSS externe
      # part en 27 Ko non compresses et bloque le rendu. On l'integre donc dans
      # le <head> de chaque page au moment du deploiement : il beneficie du gzip
      # du HTML et la requete bloquante disparait. La source reste
      # assets/aman.css, jamais dupliquee dans le depot.
      - name: Integrer le CSS dans les pages
        run: python3 .github/scripts/inline-css.py

      - name: Envoyer les fichiers en FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || './' }}
          protocol: ftp
          # Ne pas envoyer les fichiers de travail / documentation interne
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .cpanel.yml
            *.md
            **/node_modules/**
