name: Mise à jour des horaires ferry

# Rafraîchit data/traversees.json depuis les grilles horaires publiées par les
# compagnies. Si le fichier change, le commit sur main déclenche le déploiement.
# Lançable à la main : onglet Actions → ce workflow → "Run workflow".

on:
  schedule:
    - cron: '17 4 * * *'   # tous les jours vers 04h17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj-traversees
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Collecter les horaires
        run: python3 .github/scripts/maj-traversees.py

      - name: Commiter si les horaires ont changé
        run: |
          if git diff --quiet -- data/traversees.json; then
            echo "Aucun changement d'horaire."
            exit 0
          fi
          n=$(python3 -c "import json;print(len(json.load(open('data/traversees.json'))['departs']))")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traversees.json
          git commit -m "Horaires ferry : mise à jour automatique ($n traversées)"
          git push
