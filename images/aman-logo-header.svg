<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 88" role="img" aria-label="Aman Frontière">
  <defs>
    <linearGradient id="orG" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#e8cd6d"/>
      <stop offset="0.45" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#9c7717"/>
    </linearGradient>
    <linearGradient id="blG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4276"/>
      <stop offset="1" stop-color="#12305c"/>
    </linearGradient>
  </defs>

  <!-- ============ EMBLÈME ============ -->
  <!-- arche ogivale -->
  <path d="M16 66V38c0-10 7-15 12-21 4-5 7-8 10-12 3 4 6 7 10 12 5 6 12 11 12 21v28"
        fill="none" stroke="url(#orG)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- rosace à 8 branches -->
  <g transform="translate(38 36)" fill="none" stroke="url(#orG)" stroke-width="2.3" stroke-linejoin="round">
    <rect x="-11" y="-11" width="22" height="22" rx="1"/>
    <rect x="-11" y="-11" width="22" height="22" rx="1" transform="rotate(45)"/>
    <rect x="-5" y="-5" width="10" height="10" transform="rotate(45)"/>
  </g>
  <!-- porte de rempart crénelée -->
  <path d="M60 48h18v20H60z" fill="url(#blG)"/>
  <path d="M60 48v-4h4v4M67 44h4v4M74 44h4v4" fill="url(#blG)"/>
  <path d="M66 68V58a4 4 0 0 1 8 0v10z" fill="url(#orG)"/>
  <!-- route -->
  <path d="M4 76c14-7 30-10 47-10 13 0 24 1 33 4" fill="none" stroke="url(#orG)" stroke-width="3" stroke-linecap="round"/>
  <!-- voiture profilée -->
  <path d="M6 68c2-7 9-11 18-13 10-3 22-4 30-2 8 2 14 7 18 11-8 3-24 4-41 4-11 0-20 0-25 0z" fill="url(#blG)"/>
  <path d="M20 58c6-4 13-6 20-6 5 0 10 1 14 3-7 1-15 2-23 2-4 0-8 0-11 1z" fill="#fff" opacity=".92"/>

  <!-- ============ TEXTE ============ -->
  <text x="170" y="48" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="36" font-weight="700" letter-spacing="3.5" fill="#12305c">AMAN</text>

  <!-- filet doré + FRONTIÈRE -->
  <g fill="url(#orG)">
    <rect x="112" y="59" width="16" height="1.3" rx=".65"/>
    <rect x="212" y="59" width="16" height="1.3" rx=".65"/>
    <path d="M108 59.65l3.2-2.4v4.8z"/>
    <path d="M232 59.65l-3.2-2.4v4.8z"/>
  </g>
  <text x="170" y="73" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="12.5" letter-spacing="5" fill="#b8901f">FRONTIÈRE</text>
</svg>
