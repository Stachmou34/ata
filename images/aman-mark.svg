<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="Aman Frontière">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e8cd6d"/>
      <stop offset="0.45" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#9c7717"/>
    </linearGradient>
    <linearGradient id="bleu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3f74"/>
      <stop offset="1" stop-color="#0f2a52"/>
    </linearGradient>
  </defs>

  <!-- arche ogivale -->
  <path d="M58 112V64c0-16 13-24 22-34 7-8 13-14 20-22 7 8 13 14 20 22 9 10 22 18 22 34v48"
        fill="none" stroke="url(#or)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- rosace geometrique 8 branches -->
  <g transform="translate(100 62)" fill="none" stroke="url(#or)" stroke-width="3.2" stroke-linejoin="round">
    <rect x="-19" y="-19" width="38" height="38" rx="2"/>
    <rect x="-19" y="-19" width="38" height="38" rx="2" transform="rotate(45)"/>
    <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)"/>
  </g>

  <!-- porte de rempart creneles -->
  <path d="M146 76h34v34h-34z" fill="url(#bleu)"/>
  <path d="M146 76v-7h6v7M156 69h6v7M166 69h6v7M176 69h4v7" fill="url(#bleu)"/>
  <path d="M158 110V92a7 7 0 0 1 14 0v18z" fill="url(#or)"/>

  <!-- route -->
  <path d="M26 122c26-14 58-20 88-20 24 0 44 3 60 8" fill="none" stroke="url(#or)" stroke-width="5" stroke-linecap="round"/>
  <path d="M40 128c30-11 62-16 92-16 20 0 36 2 50 5" fill="none" stroke="url(#bleu)" stroke-width="4" stroke-linecap="round" opacity=".85"/>

  <!-- voiture profilee -->
  <path d="M28 108c3-11 15-18 30-22 16-5 36-7 50-3 13 4 24 11 31 19-14 4-40 7-68 7-19 0-33 0-43-1z" fill="url(#bleu)"/>
  <path d="M52 92c9-6 21-9 33-9 9 0 17 2 24 6-11 2-25 3-38 3-7 0-13 0-19 0z" fill="#fff" opacity=".9"/>
</svg>
