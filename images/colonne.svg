<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 520" fill="none" role="presentation">
  <defs>
    <linearGradient id="pierre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe7d4"/>
      <stop offset="0.5" stop-color="#f7f1e3"/>
      <stop offset="1" stop-color="#e2d6bb"/>
    </linearGradient>
    <linearGradient id="orcol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b64a"/>
      <stop offset="1" stop-color="#b8901f"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect x="8" y="486" width="56" height="16" rx="2" fill="url(#pierre)" stroke="#d8caa8"/>
  <rect x="14" y="470" width="44" height="18" rx="2" fill="url(#pierre)" stroke="#d8caa8"/>
  <rect x="14" y="482" width="44" height="2" fill="url(#orcol)" opacity=".8"/>

  <!-- fut -->
  <rect x="20" y="96" width="32" height="376" rx="3" fill="url(#pierre)" stroke="#d8caa8"/>
  <!-- filets dorés verticaux -->
  <line x1="26" y1="104" x2="26" y2="464" stroke="url(#orcol)" stroke-width="1" opacity=".55"/>
  <line x1="46" y1="104" x2="46" y2="464" stroke="url(#orcol)" stroke-width="1" opacity=".55"/>

  <!-- gravure geometrique (losanges zellige) le long du fut -->
  <g stroke="#c9a227" stroke-opacity=".5" stroke-width="1" fill="none">
    <path d="M36 118l8 10-8 10-8-10z"/>
    <path d="M36 158l8 10-8 10-8-10z"/>
    <path d="M36 198l8 10-8 10-8-10z"/>
    <path d="M36 238l8 10-8 10-8-10z"/>
    <path d="M36 278l8 10-8 10-8-10z"/>
    <path d="M36 318l8 10-8 10-8-10z"/>
    <path d="M36 358l8 10-8 10-8-10z"/>
    <path d="M36 398l8 10-8 10-8-10z"/>
    <path d="M36 438l8 10-8 10-8-10z"/>
  </g>

  <!-- chapiteau -->
  <rect x="14" y="80" width="44" height="16" rx="2" fill="url(#pierre)" stroke="#d8caa8"/>
  <rect x="14" y="92" width="44" height="2" fill="url(#orcol)" opacity=".8"/>
  <!-- petit arc outrepasse (ogive maghrebine) discret -->
  <path d="M20 80c0-16 6-24 16-30 10 6 16 14 16 30" fill="none" stroke="url(#orcol)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M28 80c0-9 3-14 8-17 5 3 8 8 8 17" fill="none" stroke="#c9a227" stroke-opacity=".45" stroke-width="1.4"/>
</svg>
