<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 620" fill="none" role="presentation">
  <defs>
    <linearGradient id="marbre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a24a"/>
      <stop offset="0.18" stop-color="#f3e2b0"/>
      <stop offset="0.45" stop-color="#fdf6e4"/>
      <stop offset="0.72" stop-color="#eed69c"/>
      <stop offset="1" stop-color="#bf9433"/>
    </linearGradient>
    <pattern id="zellige" width="18" height="18" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#b8901f" stroke-opacity=".45" stroke-width=".9">
        <rect x="4.5" y="4.5" width="9" height="9"/>
        <rect x="4.5" y="4.5" width="9" height="9" transform="rotate(45 9 9)"/>
      </g>
    </pattern>
  </defs>

  <!-- socle -->
  <rect x="6" y="592" width="78" height="22" rx="3" fill="url(#marbre)" stroke="#b8901f" stroke-opacity=".55"/>
  <rect x="14" y="572" width="62" height="22" rx="3" fill="url(#marbre)" stroke="#b8901f" stroke-opacity=".5"/>
  <rect x="14" y="586" width="62" height="2.5" fill="#b8901f" opacity=".55"/>

  <!-- fût -->
  <rect x="24" y="120" width="42" height="454" rx="4" fill="url(#marbre)" stroke="#b8901f" stroke-opacity=".45"/>
  <!-- gravure zellige sur le fût -->
  <rect x="29" y="140" width="32" height="414" fill="url(#zellige)" opacity=".75"/>
  <!-- filets dorés -->
  <line x1="29" y1="130" x2="29" y2="566" stroke="#b8901f" stroke-opacity=".6" stroke-width="1.2"/>
  <line x1="61" y1="130" x2="61" y2="566" stroke="#b8901f" stroke-opacity=".6" stroke-width="1.2"/>

  <!-- bagues décoratives -->
  <g fill="url(#marbre)" stroke="#b8901f" stroke-opacity=".5">
    <rect x="21" y="318" width="48" height="12" rx="2"/>
    <rect x="21" y="112" width="48" height="14" rx="2"/>
  </g>

  <!-- chapiteau sculpté -->
  <rect x="14" y="92" width="62" height="22" rx="3" fill="url(#marbre)" stroke="#b8901f" stroke-opacity=".5"/>
  <rect x="18" y="72" width="54" height="22" rx="3" fill="url(#marbre)" stroke="#b8901f" stroke-opacity=".5"/>
  <rect x="18" y="72" width="54" height="22" fill="url(#zellige)" opacity=".6"/>
  <rect x="14" y="106" width="62" height="2.5" fill="#b8901f" opacity=".6"/>

  <!-- départ d'arc outrepassé (discret, en haut seulement) -->
  <path d="M24 72c0-26 8-40 21-49 13 9 21 23 21 49" fill="none" stroke="#b8901f" stroke-opacity=".75" stroke-width="3" stroke-linejoin="round"/>
  <path d="M33 72c0-16 4-25 12-30 8 5 12 14 12 30" fill="none" stroke="#b8901f" stroke-opacity=".4" stroke-width="1.6"/>
  <circle cx="45" cy="16" r="4" fill="none" stroke="#b8901f" stroke-opacity=".7" stroke-width="2"/>
</svg>
